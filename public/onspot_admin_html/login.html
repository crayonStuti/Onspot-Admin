<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login — On S.P.O.T.</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: "Inter", sans-serif;
        background: #0E3E27;
        color: #2c2c2c;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .login-wrap { width: 100%; max-width: 420px; }
      .login-brand { text-align: center; margin-bottom: 20px; }
      .login-brand img { height: 54px; width: auto; display: inline-block; }
      .login-card {
        background: #fff;
        border-radius: 16px;
        padding: 34px 30px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      }
      .login-card h1 {
        font-size: 22px;
        font-weight: 800;
        color: #0E3E27;
        margin-bottom: 4px;
        text-align: center;
      }
      .login-card .sub {
        text-align: center;
        font-size: 13px;
        color: #777;
        margin-bottom: 24px;
      }
      .field { margin-bottom: 16px; }
      .field label {
        display: block;
        font-size: 12.5px;
        font-weight: 600;
        color: #3a3a3a;
        margin-bottom: 6px;
      }
      .field input {
        width: 100%;
        border: 1px solid #dcdcd5;
        border-radius: 8px;
        padding: 12px 13px;
        font-size: 14px;
        font-family: "Inter", sans-serif;
        color: #333;
        outline: none;
      }
      .field input:focus {
        border-color: #0E3E27;
        box-shadow: 0 0 0 3px rgba(14, 62, 39, 0.12);
      }
      .login-error {
        display: none;
        background: #fcebea;
        color: #c0392b;
        border: 1px solid #f3c4c0;
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 13px;
        margin-bottom: 16px;
      }
      .login-error.show { display: block; }
      .btn-login {
        width: 100%;
        height: 48px;
        border: none;
        border-radius: 8px;
        background: #0E3E27;
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: .3px;
        cursor: pointer;
        margin-top: 4px;
      }
      .btn-login:hover { background: #0a3220; }
      .login-hint {
        margin-top: 18px;
        text-align: center;
        font-size: 12px;
        color: #999;
        line-height: 1.5;
      }
      .login-hint b { color: #0E3E27; }
      .login-back {
        display: block;
        text-align: center;
        margin-top: 18px;
        color: #D9CBA0;
        font-size: 13px;
        text-decoration: none;
      }
      .login-back:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="login-wrap">
      <div class="login-brand">
        <img src="assets/images/on-spot-logo.png" alt="On S.P.O.T." />
      </div>

      <div class="login-card">
        <h1>Admin Login</h1>
        <div class="sub">Sign in to access the S.P.O.T. dashboard</div>

        <div class="login-error" id="login-error">Invalid username or password. Please try again.</div>

        <form id="login-form" novalidate>
          <div class="field">
            <label for="lg-user">Username</label>
            <input type="text" id="lg-user" name="username" placeholder="Enter your username" autocomplete="username" />
          </div>
          <div class="field">
            <label for="lg-pass">Password</label>
            <input type="password" id="lg-pass" name="password" placeholder="Enter your password" autocomplete="current-password" />
          </div>
          <button type="submit" class="btn-login">LOG IN</button>
        </form>

        <p class="login-hint">
          Demo credentials — username: <b>admin</b> &nbsp;|&nbsp; password: <b>admin123</b>
        </p>
      </div>

      <a class="login-back" href="index.html">&larr; Back to website</a>
    </div>

    <script>
      (function () {
        'use strict';
        var AUTH_KEY = 'spot_admin_auth';
        // Demo-only credentials (no backend). Replace with real auth when available.
        var VALID_USER = 'admin';
        var VALID_PASS = 'admin123';

        // If already logged in, go straight to the dashboard.
        try {
          if (sessionStorage.getItem(AUTH_KEY) === 'true') {
            window.location.replace('admin/dashboard.html');
            return;
          }
        } catch (e) {}

        var form = document.getElementById('login-form');
        var errBox = document.getElementById('login-error');

        form.addEventListener('submit', function (e) {
          e.preventDefault();
          var u = document.getElementById('lg-user').value.trim();
          var p = document.getElementById('lg-pass').value;

          if (u.toLowerCase() === VALID_USER && p === VALID_PASS) {
            try { sessionStorage.setItem(AUTH_KEY, 'true'); } catch (err) {}
            window.location.href = 'admin/dashboard.html';
          } else {
            errBox.classList.add('show');
          }
        });
      })();
    </script>
  </body>
</html>
