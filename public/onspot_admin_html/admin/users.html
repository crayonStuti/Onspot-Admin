  <!-- =================== MAIN =================== -->
  <main class="main">

    <!-- Topbar -->
    <header class="topbar">
      <h1>Users Management</h1>
      <div class="search">
        <input type="text" id="top-search" placeholder="Search" />
        <span class="s-ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </span>
      </div>
      <div class="top-actions">
        <a href="settings.html" class="icon-btn dot-only" title="Settings"><span>
          <img src="assets/images/setting-icon.png" alt="">
        </span></a>
        <a href="notifications.html" class="icon-btn num-only" title="Notifications"><span >
          <img src="assets/images/notification-icon.png" alt="">
        </span></a>
        <div class="profile">
          <img src="https://i.pravatar.cc/80?img=14" alt="" />
          <div class="meta">
            <div class="name">Leonardo Smith</div>
            <div class="role">Admin</div>
          </div>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>
    </header>

    <!-- =========== FILTER CARD =========== -->
    <section class="filter-card">
      <div class="field">
        <label for="filter-name">Search User</label>
        <div class="ctrl">
          <input type="text" id="filter-name" placeholder="Name or email" />
          <span class="end-ico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </span>
        </div>
      </div>

      <div class="field">
        <label for="filter-state">State</label>
        <div class="ctrl">
          <select id="filter-state">
            <option value="">All states</option>
            <option>Texas</option>
            <option>Florida</option>
            <option>Ohio</option>
            <option>Michigan</option>
            <option>Pennsylvania</option>
            <option>Georgia</option>
          </select>
          <span class="end-ico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </span>
        </div>
      </div>

      <div class="field">
        <label for="filter-membership">Membership Plan</label>
        <div class="ctrl">
          <select id="filter-membership">
            <option value="">All plans</option>
            <option>Free</option>
            <option>Basic</option>
            <option>Premium</option>
          </select>
          <span class="end-ico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </span>
        </div>
      </div>

      <div class="field">
        <label for="filter-status">Status</label>
        <div class="ctrl">
          <select id="filter-status">
            <option value="">All</option>
            <option>Active</option>
            <option>Inactive</option>
          </select>
          <span class="end-ico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </span>
        </div>
      </div>

      <div class="field">
        <label for="filter-joindate">Join Date</label>
        <div class="ctrl">
          <input type="date" id="filter-joindate" />
          <span class="end-ico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          </span>
        </div>
      </div>

      <div class="filter-actions">
        <div class="filter-actions-row">
          <button class="btn-reset" id="filter-reset">Reset</button>
          <button class="btn-filter" id="filter-apply">Filter</button>
        </div>
      </div>
    </section>

    <!-- =========== USERS TABLE =========== -->
  <section class="division-sec">      
    <section class="table-card">
      <div class="panel-head">
        <h3>Users</h3>
        <div class="panel-head-actions">
          <select class="dropdown" id="users-view">
            <option value="all">View all Users</option>
            <option value="active">Active only</option>
            <option value="inactive">Inactive only</option>
            <option value="premium">Premium only</option>
          </select>
          <button class="btn-export" id="export-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Export
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th style="width:60px">Select</th>
            <th>Name</th>
            <th>Email</th>
            <th>Membership</th>
            <th>Joined</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="users-tbody"></tbody>
      </table>
      <div id="users-empty" style="display:none; text-align:center; padding:40px 12px; color:#999; font-size:13px;">
        No users match your filters.
      </div>
      <div id="users-count" style="padding:12px 8px; color:#888; font-size:12.5px;"></div>
    </section>
    <div class="map-sec-user">
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d44196.236392315026!2d-93.81033787191589!3d46.185289524094266!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x52b157a8f77c8e1f%3A0xfbe655e10ff018bc!2sVineland%2C%20MN%2056359%2C%20USA!5e0!3m2!1sen!2sin!4v1781021191340!5m2!1sen!2sin" width="100%" height="100%" style="border:0;border-radius: 14px;
    box-shadow: 0 6px 20px rgba(60, 60, 60, 0.10), 0 2px 6px rgba(60, 60, 60, 0.06);" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
  </section>

  </main>
</div>
